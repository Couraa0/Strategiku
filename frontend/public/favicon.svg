<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0EA5E9" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Rounded Gradient Background Box -->
  <rect x="5" y="5" width="90" height="90" rx="26" fill="url(#bgGrad)" />

  <!-- Outer Glow Ring -->
  <rect x="5" y="5" width="90" height="90" rx="26" fill="none" stroke="#38BDF8" stroke-width="2" opacity="0.6" />

  <!-- Four-Point Sparkle Icon -->
  <g filter="url(#glow)">
    <path d="M50 20 C50 35 35 50 20 50 C35 50 50 65 50 80 C50 65 65 50 80 50 C65 50 50 35 50 20 Z" fill="#FFFFFF" />
    <circle cx="50" cy="50" r="4" fill="#38BDF8" />
  </g>

  <!-- Small Corner Sparkle -->
  <path d="M72 25 C72 30 67 35 62 35 C67 35 72 40 72 45 C72 40 77 35 82 35 C77 35 72 30 72 25 Z" fill="#F0F9FF" opacity="0.9" />
</svg>